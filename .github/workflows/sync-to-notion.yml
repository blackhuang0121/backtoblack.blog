name: Sync Metadata to Notion Database

on:
  push:
    branches: [main, content]
    paths:
      - 'posts/**'
      - 'src/app/photos/data/galleries.json'

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝依賴
        run: npm install @notionhq/client gray-matter dotenv

      - name: 執行同步腳本
        run: npm run sync-to-notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 若 Posts / Photos 使用不同 Database，可分別設定以下 Secrets：
          # NOTION_POSTS_DB_ID: ${{ secrets.NOTION_POSTS_DB_ID }}
          # NOTION_PHOTOS_DB_ID: ${{ secrets.NOTION_PHOTOS_DB_ID }}
